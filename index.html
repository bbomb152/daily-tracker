<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #21252f;
    --border: #2c313d;
    --text: #e8eaf0;
    --text-dim: #9aa1b0;
    --guitar: #f5a623;
    --gym: #ff5d5d;
    --shake: #4cd97b;
    --productive: #5da9ff;
    --stretch: #b07cff;
    --intake: #46d6c8;
    --accent: #5da9ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    min-height: 100dvh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 8px;
  }
  header h1 { font-size: 22px; letter-spacing: 0.3px; }
  .demo-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .demo-btn.on {
    background: #3a2f12;
    border-color: var(--guitar);
    color: var(--guitar);
  }
  .demo-btn.err {
    background: #3a1518;
    border-color: var(--gym);
    color: var(--gym);
  }
  .sync-row { display: flex; gap: 8px; margin-top: 10px; }
  .sync-row input {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
  }
  .sync-row button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .sync-steps { margin: 8px 0 0; padding-left: 20px; }
  .sync-steps li { margin-bottom: 6px; }
  .demo-banner {
    margin: 0 18px 4px;
    padding: 8px 12px;
    border-radius: 10px;
    background: #3a2f12;
    color: var(--guitar);
    font-size: 13px;
    text-align: center;
  }
  main {
    flex: 1;
    padding: 10px 18px 90px;
    overflow-y: auto;
  }
  /* ---------- Today ---------- */
  .datebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .datebar button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
  }
  .datebar button:disabled { opacity: 0.3; }
  .datebar .label { text-align: center; }
  .datebar .label .day { font-size: 17px; font-weight: 600; }
  .datebar .label .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .habit-row {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }
  .habit-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: var(--surface-2);
    flex-shrink: 0;
  }
  .habit-name { flex: 1; }
  .habit-name .title { font-size: 16px; font-weight: 600; }
  .habit-name .sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .check {
    width: 30px; height: 30px;
    border-radius: 999px;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: transparent;
    transition: all .15s ease;
    flex-shrink: 0;
  }
  .habit-row.done .check { color: #0f1115; font-weight: 700; }
  .habit-row.done[data-habit="guitar"] .check { background: var(--guitar); border-color: var(--guitar); }
  .habit-row.done[data-habit="gym"] .check { background: var(--gym); border-color: var(--gym); }
  .habit-row.done[data-habit="shake"] .check { background: var(--shake); border-color: var(--shake); }
  .habit-row.done[data-habit="productive"] .check { background: var(--productive); border-color: var(--productive); }
  .habit-row.done[data-habit="stretch"] .check { background: var(--stretch); border-color: var(--stretch); }
  .minutes-panel {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .minutes-panel .stepper {
    display: flex; align-items: center; gap: 10px;
  }
  .minutes-panel button {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    width: 38px; height: 34px;
    font-size: 16px;
    cursor: pointer;
  }
  .minutes-panel .mins {
    min-width: 76px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--guitar);
  }
  .chips { display: flex; gap: 6px; margin-left: auto; }
  .chips button {
    width: auto;
    padding: 0 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .today-summary {
    text-align: center;
    color: var(--text-dim);
    font-size: 13.5px;
    margin-top: 16px;
  }
  /* ---------- Stats ---------- */
  h2 { font-size: 15px; color: var(--text-dim); font-weight: 600; margin: 18px 2px 10px; }
  h2:first-child { margin-top: 4px; }
  .streak-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .streak-card { padding: 12px 14px; margin-bottom: 0; }
  .streak-card .h { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
  .streak-card .big { font-size: 26px; font-weight: 700; margin-top: 6px; }
  .streak-card .best { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 99px; display: inline-block; }
  .heatmap { overflow-x: auto; padding-bottom: 4px; }
  .heatmap-grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, 13px);
    gap: 3px;
    width: max-content;
  }
  .heatmap-cell {
    width: 13px; height: 13px;
    border-radius: 3px;
    background: var(--surface-2);
  }
  .hm-1 { background: #1d4030; }
  .hm-2 { background: #20683f; }
  .hm-3 { background: #2fa45c; }
  .hm-4 { background: #4cd97b; }
  .hm-5 { background: #6ef09a; }
  .heatmap-legend {
    display: flex; align-items: center; gap: 4px;
    font-size: 11.5px; color: var(--text-dim);
    margin-top: 8px;
  }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-row .lbl { width: 96px; font-size: 13px; color: var(--text-dim); flex-shrink: 0; }
  .bar-row .track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: 99px; }
  .bar-row .pct { width: 40px; text-align: right; font-size: 13px; font-weight: 600; }
  svg text { font-family: inherit; }
  /* ---------- Data ---------- */
  .data-actions button {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
  }
  .data-actions button.danger { color: var(--gym); border-color: #4a2c2c; }
  .hint { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin-top: 14px; }
  /* ---------- Intake ---------- */
  .intake-total {
    text-align: center;
    padding: 22px 16px 24px;
  }
  .intake-total .num {
    font-size: 56px;
    font-weight: 700;
    color: var(--intake);
    line-height: 1;
  }
  .intake-total .unit { font-size: 22px; color: var(--text-dim); font-weight: 600; }
  .intake-total .sub { font-size: 13px; color: var(--text-dim); margin-top: 8px; }
  .intake-add {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .intake-add button {
    background: var(--intake);
    color: #06201d;
    border: none;
    border-radius: 14px;
    padding: 20px 0;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
  }
  .intake-add button:active { filter: brightness(0.9); }
  .intake-undo {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .intake-undo button {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 12px;
    padding: 11px 0;
    font-size: 15px;
    cursor: pointer;
  }
  .intake-undo button:disabled { opacity: 0.35; }
  .intake-list { list-style: none; }
  .intake-list li {
    display: flex;
    justify-content: space-between;
    padding: 9px 2px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .intake-list li:last-child { border-bottom: none; }
  .intake-list .amt { color: var(--intake); font-weight: 600; }
  .intake-list .none { color: var(--text-dim); }
  /* ---------- Tabs ---------- */
  nav.tabs {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 560px;
    display: flex;
    background: rgba(24, 27, 34, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    padding: 10px 0 12px;
    cursor: pointer;
  }
  nav.tabs button .ico { display: block; font-size: 20px; margin-bottom: 3px; }
  nav.tabs button.active { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Habits</h1>
  <button class="demo-btn" id="syncPill" hidden title="Cloud sync status — tap to sync now">☁️</button>
  <button class="demo-btn" id="demoToggle">Demo: off</button>
</header>
<div id="demoBanner" class="demo-banner" hidden>Viewing demo data — your real data is safe</div>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="today" class="active"><span class="ico">☑️</span>Today</button>
  <button data-tab="intake"><span class="ico">💧</span>Intake</button>
  <button data-tab="stats"><span class="ico">📈</span>Stats</button>
  <button data-tab="data"><span class="ico">⚙️</span>Data</button>
</nav>

<script>
"use strict";

// ---------- Constants ----------
const HABITS = [
  { id: "guitar",     name: "Practice guitar",  icon: "🎸", color: "var(--guitar)",     hex: "#f5a623" },
  { id: "gym",        name: "Go to the gym",    icon: "🏋️", color: "var(--gym)",        hex: "#ff5d5d" },
  { id: "shake",      name: "Protein shake",    icon: "🥤", color: "var(--shake)",      hex: "#4cd97b" },
  { id: "productive", name: "Did something productive", icon: "✅", color: "var(--productive)", hex: "#5da9ff" },
  { id: "stretch",    name: "Stretching",        icon: "🧘", color: "var(--stretch)",    hex: "#b07cff" },
];
const INTAKE_UNIT = "mg";
const REAL_KEY = "habitlog.v1";
const DEMO_KEY = "habitlog.demo.v1";
const DEMO_FLAG = "habitlog.demoMode";

// ---------- Date helpers (local time, YYYY-MM-DD) ----------
function fmt(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parse(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addDays(s, n) {
  const d = parse(s);
  d.setDate(d.getDate() + n);
  return fmt(d);
}
function today() { return fmt(new Date()); }

// ---------- State ----------
let demoMode = localStorage.getItem(DEMO_FLAG) === "1";
let currentDate = today();
let activeTab = "today";

function storageKey() { return demoMode ? DEMO_KEY : REAL_KEY; }

function loadData() {
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) {
      const obj = JSON.parse(raw);
      if (obj && typeof obj.entries === "object") return obj;
    }
  } catch (e) { /* fall through to fresh state */ }
  return { entries: {} };
}
function saveData(data) {
  localStorage.setItem(storageKey(), JSON.stringify(data));
}
let data = loadData();

function getEntry(dateStr) {
  return data.entries[dateStr] || { guitar: false, guitarMins: 0, gym: false, shake: false, productive: false, stretch: false, intake: 0 };
}
function setEntry(dateStr, entry) {
  entry.ts = Date.now(); // per-day edit time, used to resolve sync conflicts
  data.entries[dateStr] = entry;
  saveData(data);
  if (!demoMode) schedulePush();
}
function isDone(entry, habitId) {
  if (habitId === "guitar") return !!entry.guitar || (entry.guitarMins || 0) > 0;
  return !!entry[habitId];
}

// ---------- Demo data ----------
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function generateDemoData() {
  const rng = mulberry32(20260611);
  const entries = {};
  const start = addDays(today(), -90);
  let d = start;
  while (d <= today()) {
    const dow = parse(d).getDay(); // 0 = Sunday
    const e = { guitar: false, guitarMins: 0, gym: false, shake: false, productive: false, stretch: false, intake: 0 };
    // Guitar: ~70% of days, more on weekends, 15–60 min
    if (rng() < (dow === 0 || dow === 6 ? 0.85 : 0.65)) {
      e.guitar = true;
      e.guitarMins = [15, 20, 30, 30, 45, 45, 60][Math.floor(rng() * 7)];
    }
    // Gym: Mon/Tue/Thu/Fri pattern, ~80% adherence; rare weekend session
    const gymDay = [1, 2, 4, 5].includes(dow);
    if ((gymDay && rng() < 0.8) || (!gymDay && rng() < 0.1)) e.gym = true;
    // Shake: almost always on gym days, sometimes otherwise
    if (e.gym ? rng() < 0.92 : rng() < 0.25) e.shake = true;
    // Productive: ~80%, slightly lower on Sundays
    if (rng() < (dow === 0 ? 0.6 : 0.82)) e.productive = true;
    // Stretching: often after the gym, sometimes on its own (~55%)
    if (e.gym ? rng() < 0.7 : rng() < 0.45) e.stretch = true;
    // Intake: a few doses most days, in multiples of 3
    e.intake = [0, 0, 3, 6, 6, 9, 9, 12][Math.floor(rng() * 8)];
    entries[d] = e;
    d = addDays(d, 1);
  }
  return { entries };
}

function setDemoMode(on) {
  demoMode = on;
  localStorage.setItem(DEMO_FLAG, on ? "1" : "0");
  if (on && !localStorage.getItem(DEMO_KEY)) {
    localStorage.setItem(DEMO_KEY, JSON.stringify(generateDemoData()));
  }
  data = loadData();
  currentDate = today();
  renderChrome();
  render();
}

// ---------- Cloud sync (secret GitHub Gist) ----------
// The log lives in a secret Gist in the user's GitHub account, found by its
// description marker. Sync = pull, merge per-day by newest ts, push if local
// had anything newer. Demo data never syncs.
const SYNC_TOKEN_KEY = "habitlog.sync.token";
const SYNC_GIST_KEY = "habitlog.sync.gist";
const GIST_MARKER = "habit-tracker-sync-v1";
const GIST_FILE = "habits.json";

let syncToken = localStorage.getItem(SYNC_TOKEN_KEY) || "";
let gistId = localStorage.getItem(SYNC_GIST_KEY) || "";
let syncState = "idle";   // idle | syncing | synced | error
let syncMsg = "";
let lastSyncAt = 0;
let pushTimer = null;
let syncBusy = false;
let syncQueued = false;

async function ghApi(method, path, body) {
  const res = await fetch("https://api.github.com" + path, {
    method,
    headers: {
      "Authorization": "Bearer " + syncToken,
      "Accept": "application/vnd.github+json",
      ...(body ? { "Content-Type": "application/json" } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
    keepalive: true,
  });
  if (!res.ok) {
    const err = new Error("GitHub API " + res.status);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

// Sync always operates on the REAL store, even while demo mode is showing.
function realData() {
  if (!demoMode) return data;
  try {
    const raw = localStorage.getItem(REAL_KEY);
    const o = raw ? JSON.parse(raw) : null;
    if (o && typeof o.entries === "object") return o;
  } catch (e) { /* fresh */ }
  return { entries: {} };
}
function saveRealData(d) {
  if (!demoMode) { data = d; saveData(data); }
  else localStorage.setItem(REAL_KEY, JSON.stringify(d));
}

function mergeEntries(local, remote) {
  const merged = { entries: {} };
  let localNewer = false, localChanged = false;
  const dates = new Set([...Object.keys(local.entries), ...Object.keys(remote.entries)]);
  for (const day of dates) {
    const l = local.entries[day], r = remote.entries[day];
    if (l && r) {
      const same = JSON.stringify(l) === JSON.stringify(r);
      const pick = (r.ts || 0) > (l.ts || 0) ? r : l;
      merged.entries[day] = pick;
      if (!same) { if (pick === l) localNewer = true; else localChanged = true; }
    } else if (l) { merged.entries[day] = l; localNewer = true; }
    else { merged.entries[day] = r; localChanged = true; }
  }
  return { merged, localNewer, localChanged };
}

async function findOrCreateGist() {
  if (gistId) return gistId;
  const gists = await ghApi("GET", "/gists?per_page=100");
  const mine = gists.find(g => g.description === GIST_MARKER && g.files && g.files[GIST_FILE]);
  if (mine) {
    gistId = mine.id;
  } else {
    const created = await ghApi("POST", "/gists", {
      description: GIST_MARKER,
      public: false,
      files: { [GIST_FILE]: { content: JSON.stringify(realData()) } },
    });
    gistId = created.id;
  }
  localStorage.setItem(SYNC_GIST_KEY, gistId);
  return gistId;
}

// replace=true overwrites the cloud with local as-is (clear / import).
async function syncNow(replace = false) {
  if (!syncToken) return;
  if (syncBusy) { syncQueued = true; return; }
  syncBusy = true;
  setSyncState("syncing");
  try {
    const hadGist = !!gistId;
    await findOrCreateGist();
    let local = realData();
    let needPush = replace || !hadGist;
    if (!replace && hadGist) {
      const g = await ghApi("GET", "/gists/" + gistId);
      const f = g.files && g.files[GIST_FILE];
      let remote = { entries: {} };
      if (f) {
        try {
          const content = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
          const o = JSON.parse(content);
          if (o && typeof o.entries === "object") remote = o;
        } catch (e) { /* corrupt remote: treat as empty, local wins */ }
      }
      const { merged, localNewer, localChanged } = mergeEntries(local, remote);
      local = merged;
      if (localChanged) {
        saveRealData(merged);
        if (!demoMode) render();
      }
      needPush = localNewer;
    }
    if (needPush) {
      await ghApi("PATCH", "/gists/" + gistId, {
        files: { [GIST_FILE]: { content: JSON.stringify(local) } },
      });
    }
    lastSyncAt = Date.now();
    setSyncState("synced");
  } catch (e) {
    if (e.status === 401) {
      setSyncState("error", "GitHub rejected the token — it may be expired or revoked");
    } else if ((e.status === 403 || e.status === 404) && !gistId) {
      setSyncState("error", "Token can't access gists — use a classic token with the gist scope");
    } else if (e.status === 404 && gistId) {
      gistId = "";
      localStorage.removeItem(SYNC_GIST_KEY);
      setSyncState("error", "Sync gist was deleted — it will be recreated on the next sync");
    } else {
      setSyncState("error", navigator.onLine ? "Sync failed — will retry" : "Offline — will sync when back online");
    }
  } finally {
    syncBusy = false;
    if (syncQueued) { syncQueued = false; syncNow(); }
  }
}

function schedulePush() {
  if (!syncToken || demoMode) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { pushTimer = null; syncNow(); }, 1200);
}

function setSyncState(s, msg) {
  syncState = s;
  syncMsg = msg || "";
  const pill = document.getElementById("syncPill");
  pill.hidden = !syncToken;
  if (syncToken) {
    pill.textContent = s === "syncing" ? "☁️ syncing" : s === "error" ? "☁️ !" : "☁️ ✓";
    pill.classList.toggle("err", s === "error");
  }
  const status = document.getElementById("syncStatus");
  if (status) status.textContent = syncStatusText();
}

function syncStatusText() {
  if (!syncToken) return syncMsg || "";
  if (syncState === "syncing") return "Syncing…";
  if (syncState === "error") return "⚠️ " + syncMsg;
  if (lastSyncAt) {
    return "Synced ✓ " + new Date(lastSyncAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  return "Connected — waiting for first sync";
}

function disconnectSync() {
  syncToken = "";
  gistId = "";
  localStorage.removeItem(SYNC_TOKEN_KEY);
  localStorage.removeItem(SYNC_GIST_KEY);
  clearTimeout(pushTimer);
  pushTimer = null;
  setSyncState("idle");
}

// ---------- Stats helpers ----------
function currentStreak(habitId) {
  let d = today();
  // Today doesn't break a streak if not yet logged
  if (!isDone(getEntry(d), habitId)) d = addDays(d, -1);
  let n = 0;
  while (isDone(getEntry(d), habitId)) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(habitId) {
  const dates = Object.keys(data.entries).filter(d => isDone(data.entries[d], habitId)).sort();
  let best = 0, run = 0, prev = null;
  for (const d of dates) {
    run = (prev !== null && addDays(prev, 1) === d) ? run + 1 : 1;
    if (run > best) best = run;
    prev = d;
  }
  return best;
}
function completionRate(habitId, days) {
  let done = 0;
  for (let i = 0; i < days; i++) {
    if (isDone(getEntry(addDays(today(), -i)), habitId)) done++;
  }
  return done / days;
}
function weeklyGuitarMinutes(weeks) {
  // Returns [{label, mins}] oldest → newest, weeks ending on the current week (Mon-start)
  const t = parse(today());
  const dowMon = (t.getDay() + 6) % 7; // 0 = Monday
  const thisMonday = addDays(today(), -dowMon);
  const out = [];
  for (let w = weeks - 1; w >= 0; w--) {
    const monday = addDays(thisMonday, -7 * w);
    let mins = 0;
    for (let i = 0; i < 7; i++) {
      const day = addDays(monday, i);
      if (day > today()) break;
      mins += getEntry(day).guitarMins || 0;
    }
    const md = parse(monday);
    out.push({ label: `${md.getMonth() + 1}/${md.getDate()}`, mins });
  }
  return out;
}

// ---------- Rendering ----------
const view = document.getElementById("view");

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderChrome() {
  const btn = document.getElementById("demoToggle");
  btn.textContent = demoMode ? "Demo: on" : "Demo: off";
  btn.classList.toggle("on", demoMode);
  document.getElementById("demoBanner").hidden = !demoMode;
}

function render() {
  if (activeTab === "today") renderToday();
  else if (activeTab === "intake") renderIntake();
  else if (activeTab === "stats") renderStats();
  else renderData();
}

function renderToday() {
  const entry = getEntry(currentDate);
  const d = parse(currentDate);
  const isToday = currentDate === today();
  const dayLabel = isToday ? "Today" : d.toLocaleDateString(undefined, { weekday: "long" });
  const subLabel = d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  const doneCount = HABITS.filter(h => isDone(entry, h.id)).length;

  let html = `
    <div class="datebar">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <div class="label"><div class="day">${dayLabel}</div><div class="sub">${subLabel}</div></div>
      <button id="nextDay" aria-label="Next day" ${isToday ? "disabled" : ""}>›</button>
    </div>`;

  for (const h of HABITS) {
    const done = isDone(entry, h.id);
    let inner = `
      <div class="habit-row ${done ? "done" : ""}" data-habit="${h.id}">
        <div class="habit-icon">${h.icon}</div>
        <div class="habit-name">
          <div class="title">${esc(h.name)}</div>
          ${h.id === "guitar" && done ? `<div class="sub">${entry.guitarMins || 0} minutes</div>` : ""}
        </div>
        <div class="check">✓</div>
      </div>`;
    if (h.id === "guitar" && done) {
      inner += `
        <div class="minutes-panel">
          <div class="stepper">
            <button data-mins="-5">−</button>
            <span class="mins">${entry.guitarMins || 0} min</span>
            <button data-mins="5">+</button>
          </div>
          <div class="chips">
            <button data-set-mins="15">15</button>
            <button data-set-mins="30">30</button>
            <button data-set-mins="60">60</button>
          </div>
        </div>`;
    }
    html += `<div class="card">${inner}</div>`;
  }
  html += `<div class="today-summary">${doneCount} of ${HABITS.length} habits done${isToday ? " today" : ""}</div>`;
  view.innerHTML = html;

  document.getElementById("prevDay").onclick = () => { currentDate = addDays(currentDate, -1); render(); };
  const next = document.getElementById("nextDay");
  if (next) next.onclick = () => { if (currentDate < today()) { currentDate = addDays(currentDate, 1); render(); } };

  view.querySelectorAll(".habit-row").forEach(row => {
    row.addEventListener("click", () => {
      const id = row.dataset.habit;
      const e = getEntry(currentDate);
      if (id === "guitar") {
        const nowDone = !isDone(e, "guitar");
        e.guitar = nowDone;
        if (nowDone && !e.guitarMins) e.guitarMins = 30;
        if (!nowDone) e.guitarMins = 0;
      } else {
        e[id] = !e[id];
      }
      setEntry(currentDate, e);
      render();
    });
  });
  view.querySelectorAll("[data-mins]").forEach(btn => {
    btn.addEventListener("click", ev => {
      ev.stopPropagation();
      const e = getEntry(currentDate);
      e.guitarMins = Math.max(5, (e.guitarMins || 0) + Number(btn.dataset.mins));
      e.guitar = true;
      setEntry(currentDate, e);
      render();
    });
  });
  view.querySelectorAll("[data-set-mins]").forEach(btn => {
    btn.addEventListener("click", ev => {
      ev.stopPropagation();
      const e = getEntry(currentDate);
      e.guitarMins = Number(btn.dataset.setMins);
      e.guitar = true;
      setEntry(currentDate, e);
      render();
    });
  });
}

function renderIntake() {
  const entry = getEntry(currentDate);
  const total = entry.intake || 0;
  const d = parse(currentDate);
  const isToday = currentDate === today();
  const dayLabel = isToday ? "Today" : d.toLocaleDateString(undefined, { weekday: "long" });
  const subLabel = d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });

  // Last 14 days history (newest first), with mini bars
  const days = [];
  let maxDay = 0;
  for (let i = 0; i < 14; i++) {
    const day = addDays(today(), -i);
    const amt = getEntry(day).intake || 0;
    if (amt > maxDay) maxDay = amt;
    days.push({ day, amt });
  }
  const last7 = days.slice(0, 7).reduce((s, x) => s + x.amt, 0);

  let history = "";
  for (const { day, amt } of days) {
    const pd = parse(day);
    const lbl = day === today() ? "Today"
      : day === addDays(today(), -1) ? "Yesterday"
      : pd.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    const w = maxDay > 0 ? Math.round((amt / maxDay) * 100) : 0;
    history += `<li>
      <span>${lbl}</span>
      <span style="flex:1;margin:0 12px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden">
        <span style="display:block;height:100%;width:${w}%;background:var(--intake)"></span></span>
      <span class="${amt > 0 ? "amt" : "none"}">${amt} ${INTAKE_UNIT}</span>
    </li>`;
  }

  view.innerHTML = `
    <div class="datebar">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <div class="label"><div class="day">${dayLabel}</div><div class="sub">${subLabel}</div></div>
      <button id="nextDay" aria-label="Next day" ${isToday ? "disabled" : ""}>›</button>
    </div>
    <div class="card">
      <div class="intake-total">
        <div><span class="num">${total}</span> <span class="unit">${INTAKE_UNIT}</span></div>
        <div class="sub">${isToday ? "total today" : "total this day"}</div>
      </div>
      <div class="intake-add">
        <button data-add="3">+3</button>
        <button data-add="6">+6</button>
      </div>
      <div class="intake-undo">
        <button data-add="-3" ${total < 3 ? "disabled" : ""}>−3</button>
        <button data-add="-6" ${total < 6 ? "disabled" : ""}>−6</button>
        <button id="intakeReset" ${total === 0 ? "disabled" : ""}>Reset</button>
      </div>
    </div>
    <h2>Last 7 days</h2>
    <div class="card" style="font-size:14px;color:var(--text-dim)">
      ${last7} ${INTAKE_UNIT} total · avg ${(last7 / 7).toFixed(1)} ${INTAKE_UNIT}/day
    </div>
    <h2>History</h2>
    <div class="card"><ul class="intake-list">${history}</ul></div>`;

  document.getElementById("prevDay").onclick = () => { currentDate = addDays(currentDate, -1); render(); };
  const next = document.getElementById("nextDay");
  if (next) next.onclick = () => { if (currentDate < today()) { currentDate = addDays(currentDate, 1); render(); } };

  function bump(delta) {
    const e = getEntry(currentDate);
    e.intake = Math.max(0, (e.intake || 0) + delta);
    setEntry(currentDate, e);
    render();
  }
  view.querySelectorAll("[data-add]").forEach(btn => {
    btn.addEventListener("click", () => bump(Number(btn.dataset.add)));
  });
  document.getElementById("intakeReset").onclick = () => {
    const e = getEntry(currentDate);
    e.intake = 0;
    setEntry(currentDate, e);
    render();
  };
}

function renderStats() {
  let html = `<h2>Streaks</h2><div class="streak-grid">`;
  for (const h of HABITS) {
    const cur = currentStreak(h.id);
    const best = bestStreak(h.id);
    html += `
      <div class="card streak-card">
        <div class="h"><span class="dot" style="background:${h.color}"></span>${h.icon} ${esc(h.name.replace("Did something productive", "Productive"))}</div>
        <div class="big">${cur} <span style="font-size:14px;color:var(--text-dim)">day${cur === 1 ? "" : "s"}</span></div>
        <div class="best">best: ${best}</div>
      </div>`;
  }
  html += `</div>`;

  // Heatmap: last 16 weeks, Mon-start columns, intensity = habits done that day
  html += `<h2>Last 16 weeks · habits per day</h2><div class="card"><div class="heatmap"><div class="heatmap-grid">`;
  const t = parse(today());
  const dowMon = (t.getDay() + 6) % 7;
  const thisMonday = addDays(today(), -dowMon);
  const firstMonday = addDays(thisMonday, -7 * 15);
  for (let w = 0; w < 16; w++) {
    for (let i = 0; i < 7; i++) {
      const day = addDays(firstMonday, w * 7 + i);
      if (day > today()) { html += `<div class="heatmap-cell" style="background:transparent"></div>`; continue; }
      const e = getEntry(day);
      const n = HABITS.filter(h => isDone(e, h.id)).length;
      html += `<div class="heatmap-cell ${n > 0 ? "hm-" + n : ""}" title="${day}: ${n}/${HABITS.length}"></div>`;
    }
  }
  html += `</div></div>
    <div class="heatmap-legend">0
      <span class="heatmap-cell"></span><span class="heatmap-cell hm-1"></span><span class="heatmap-cell hm-2"></span><span class="heatmap-cell hm-3"></span><span class="heatmap-cell hm-4"></span><span class="heatmap-cell hm-5"></span>
    ${HABITS.length} habits</div></div>`;

  // Guitar minutes per week (SVG bar chart, last 8 weeks)
  const weeks = weeklyGuitarMinutes(8);
  const maxMins = Math.max(60, ...weeks.map(w => w.mins));
  const W = 480, H = 170, padL = 34, padB = 26, padT = 14;
  const bw = (W - padL - 10) / weeks.length;
  let bars = "";
  weeks.forEach((w, i) => {
    const bh = (w.mins / maxMins) * (H - padT - padB);
    const x = padL + i * bw + bw * 0.15;
    const y = H - padB - bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(bh, w.mins > 0 ? 2 : 0).toFixed(1)}" rx="4" fill="#f5a623"/>`;
    bars += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#9aa1b0">${w.label}</text>`;
    if (w.mins > 0) bars += `<text x="${(x + bw * 0.35).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="#e8eaf0">${w.mins}</text>`;
  });
  html += `<h2>Guitar minutes per week</h2><div class="card">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Guitar minutes per week">
      <line x1="${padL}" y1="${H - padB}" x2="${W - 6}" y2="${H - padB}" stroke="#2c313d"/>
      <text x="4" y="${padT + 6}" font-size="10" fill="#9aa1b0">${maxMins}m</text>
      ${bars}
    </svg></div>`;

  // 30-day completion
  html += `<h2>Last 30 days</h2><div class="card">`;
  for (const h of HABITS) {
    const r = Math.round(completionRate(h.id, 30) * 100);
    html += `
      <div class="bar-row">
        <div class="lbl">${h.icon} ${esc(h.id === "productive" ? "Productive" : h.id === "shake" ? "Shake" : h.id[0].toUpperCase() + h.id.slice(1))}</div>
        <div class="track"><div class="fill" style="width:${r}%;background:${h.color}"></div></div>
        <div class="pct">${r}%</div>
      </div>`;
  }
  html += `</div>`;
  view.innerHTML = html;
}

function renderData() {
  const count = Object.keys(data.entries).length;
  const syncCard = syncToken ? `
    <h2>Cloud sync</h2>
    <div class="card" style="font-size:14px">
      <div>Cloud sync is <b>on</b> — your log is saved to a secret Gist in your GitHub account
      and shared by every device you connect.</div>
      <p class="hint" id="syncStatus">${syncStatusText()}</p>
      <div class="data-actions">
        <button id="syncNowBtn">🔄 Sync now</button>
        <button id="disconnectBtn" class="danger">Disconnect sync</button>
      </div>
    </div>` : `
    <h2>Cloud sync</h2>
    <div class="card" style="font-size:14px">
      <div>Sync your log across devices via a secret Gist in your GitHub account. One-time setup:</div>
      <ol class="sync-steps hint">
        <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=Habit+Tracker+Sync"
          target="_blank" rel="noopener">Create a GitHub token</a> — keep the pre-selected
          <b>gist</b> scope, set Expiration to <b>No expiration</b>, then Generate.</li>
        <li>Copy the <code>ghp_…</code> token and paste it below. Do this once on each device.</li>
      </ol>
      <div class="sync-row">
        <input id="tokenInput" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false">
        <button id="connectBtn">Connect</button>
      </div>
      <p class="hint" id="syncStatus">${syncStatusText()}</p>
    </div>`;
  view.innerHTML = `
    ${syncCard}
    <h2>Your data</h2>
    <div class="card" style="font-size:14px;color:var(--text-dim)">
      ${count} day${count === 1 ? "" : "s"} logged${demoMode ? " (demo)" : ""} ·
      ${syncToken && !demoMode ? "synced to GitHub + stored in this browser" : "stored locally in this browser"}
    </div>
    <div class="data-actions">
      <button id="exportBtn">⬇️ Export data (JSON)</button>
      <button id="importBtn">⬆️ Import data (JSON)</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button id="clearBtn" class="danger">🗑️ Clear ${demoMode ? "demo" : "all"} data</button>
    </div>
    <p class="hint">${syncToken
      ? "A local copy lives in this browser; cloud sync keeps every connected device on the same log."
      : "Data lives in this browser's localStorage, so your phone and computer each keep their own log. Connect cloud sync above to share one log everywhere."}</p>`;

  if (syncToken) {
    document.getElementById("syncNowBtn").onclick = () => syncNow();
    document.getElementById("disconnectBtn").onclick = () => {
      if (!confirm("Disconnect cloud sync on this device? Your data stays here and in the cloud; this device just stops syncing.")) return;
      disconnectSync();
      render();
    };
  } else {
    const tokenInput = document.getElementById("tokenInput");
    document.getElementById("connectBtn").onclick = async () => {
      const t = tokenInput.value.trim();
      if (!t) { tokenInput.focus(); return; }
      syncToken = t;
      setSyncState("syncing");
      try {
        await ghApi("GET", "/user");
        localStorage.setItem(SYNC_TOKEN_KEY, t);
        await syncNow();
        render();
      } catch (e) {
        syncToken = "";
        setSyncState("idle", "⚠️ GitHub rejected that token — check it was copied fully and has the gist scope");
        const status = document.getElementById("syncStatus");
        if (status) status.textContent = syncMsg;
      }
    };
  }

  document.getElementById("exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `habits-${today()}${demoMode ? "-demo" : ""}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = ev => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || typeof obj.entries !== "object") throw new Error("bad shape");
        data = obj;
        saveData(data);
        if (!demoMode && syncToken) syncNow(true); // imported file becomes the cloud copy too
        render();
      } catch (e) {
        alert("That file doesn't look like a habits export.");
      }
    };
    reader.readAsText(file);
  };
  document.getElementById("clearBtn").onclick = () => {
    const where = demoMode ? "demo" : (syncToken ? "ALL (this device AND the cloud copy)" : "ALL");
    if (!confirm(`Delete ${where} habit data? This can't be undone.`)) return;
    localStorage.removeItem(storageKey());
    data = loadData();
    if (!demoMode && syncToken) syncNow(true); // clear the cloud copy as well
    render();
  };
}

// ---------- Wiring ----------
document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });
});
document.getElementById("demoToggle").addEventListener("click", () => setDemoMode(!demoMode));
document.getElementById("syncPill").addEventListener("click", () => syncNow());

// Pull fresh data whenever the app comes back to the foreground (e.g. phone
// reopens the PWA); flush any pending edit when it goes to the background.
document.addEventListener("visibilitychange", () => {
  if (!syncToken) return;
  if (document.visibilityState === "visible") syncNow();
  else if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; syncNow(); }
});
window.addEventListener("online", () => { if (syncToken) syncNow(); });

renderChrome();
render();
setSyncState(syncState);
if (syncToken) syncNow();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
